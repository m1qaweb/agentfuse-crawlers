name: Validate Scrapy Cloud package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      TZ: UTC
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install .
      - name: Reproduce Zyte Scrapy Cloud legacy egg packaging
        run: |
          python -c "import setuptools; print('setuptools available:', setuptools.__version__)"
          python setup.py bdist_egg
          python - <<'PY'
          from pathlib import Path
          built = sorted(Path('dist').glob('*.egg'))
          assert built, 'Legacy egg was not created'
          print('Zyte-compatible egg package:', built[0])
          PY
      - name: Verify deployable egg bytes match package fingerprint
        run: python -m scripts.verify_package_fingerprint
      - name: Verify Scrapy recognizes all three spiders
        run: |
          scrapy list
          python - <<'PY'
          from scrapy.utils.project import get_project_settings
          from scrapy.spiderloader import SpiderLoader
          names = set(SpiderLoader.from_settings(get_project_settings()).list())
          expected = {'official_documentation', 'official_pricing', 'official_changelogs'}
          assert expected == names, (expected, names)
          print('Spiders registered:', ', '.join(sorted(names)))
          PY
      - name: Verify deployed package settings entry point and source data
        run: |
          python - <<'PY'
          from importlib.metadata import distribution
          from agentfuse_crawlers.sources import load_sources
          points = [e for e in distribution('agentfuse-crawlers').entry_points if e.group == 'scrapy' and e.name == 'settings']
          assert len(points) == 1, points
          assert points[0].value == 'agentfuse_crawlers.settings', points[0].value
          from collections import Counter
          sources = load_sources()
          assert len(sources) == 460, len(sources)
          assert Counter(s['category'] for s in sources) == {'documentation': 194, 'pricing': 177, 'changelog': 89}
          print('Scrapy Cloud packaging entry point and manifest: OK')
          PY
      - name: Verify no new spiders and freshness protections
        run: |
          python - <<'PY'
          from scrapy.utils.project import get_project_settings
          s = get_project_settings()
          assert s.getbool('ROBOTSTXT_OBEY')
          assert not s.getbool('HTTPCACHE_ENABLED')
          assert s.getbool('REDIRECT_ENABLED')  # robots.txt redirects remain functional
          assert not s.getbool('METAREFRESH_ENABLED')
          assert s.get('DEFAULT_REQUEST_HEADERS')['Cache-Control'] == 'no-cache'
          assert 'agentfuse_crawlers.extensions.coverage.SourceCoverageAudit' in s.get('EXTENSIONS')
          print('Fresh-fetch and per-source redirect protection enabled.')
          PY
      - name: Run synthetic P08 accuracy corpus (never live publisher data)
        run: |
          python -m scripts.replay_gold --out output/ci-synthetic/synthetic_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/ci-synthetic/synthetic_report.json").read_text())
          assert report["synthetic_only"] is True
          assert report["independently_human_reviewed"] is False
          assert report["pass"] is True
          assert report["date_cases"] >= 24 and report["rate_cases"] >= 240
          assert report["false_latest_date_errors"] == 0
          assert report["unscoped_rate_false_comparable"] == 0
          print("Synthetic extractor regression passed; NOT a production release approval")
          PY
      - name: Verify missing independent evidence BLOCKS production release
        run: |
          python -m scripts.quality_gates --synthetic-report output/ci-synthetic/synthetic_report.json --out-dir output/ci-synthetic/gates
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/ci-synthetic/gates/quality_gate_report.json").read_text())
          assert report["status"] == "blocked_pending_evidence_or_quality", report
          assert report["deployment_authorized"] is False
          assert report["advisor_fact_approvals"] == 0
          assert report["checks"]["synthetic_replay"] is True
          assert report["checks"]["independent_pricing_gold"] is False
          assert report["checks"]["two_repeat_canaries"] is False
          print("Production quality gates correctly block unreviewed/unobserved evidence")
          PY
      - name: Run unit tests
        run: python -m pytest -q
      - name: Publish synthetic-only regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p08-synthetic-regression-py${{ matrix.python-version }}
          path: output/ci-synthetic
          if-no-files-found: ignore
          retention-days: 7

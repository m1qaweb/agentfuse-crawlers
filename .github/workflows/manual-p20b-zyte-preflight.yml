name: Prepare Zyte UI preflight (no crawl)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/manual-p20b-zyte-preflight.yml'
      - 'scripts/prepare_zyte_ui_args.py'
      - 'scripts/full_inventory_readiness.py'
      - 'tests/test_p20b_zyte_ui_args.py'
      - 'docs/P20B_NO_LOCAL_ZYTE_UI_GUIDE.md'
      - 'agentfuse_crawlers/validation_access.py'
      - 'agentfuse_crawlers/spiders/official.py'
      - 'tests/test_p21b_run_authorization.py'
      - 'docs/P23E0_THREE_ARGUMENT_FULL_CATEGORY_ZYTE_UI.md'
      - 'agentfuse_crawlers/release_events.py'
      - 'agentfuse_crawlers/pricing_adapters.py'
      - 'agentfuse_crawlers/pricing_evidence.py'
      - 'scripts/assemble_pricing_windows.py'
      - 'scripts/p22c_same_snapshot_replay.py'
      - 'tests/test_p23d4_cloudflare_literal_token_components.py'
      - 'docs/P23D4_CLOUDFLARE_LITERAL_TOKEN_PRICE_COMPONENTS.md'
      - 'agentfuse_crawlers/quality.py'
      - 'scripts/compare_exports.py'
      - 'docs/P23D3_GITHUB_RELEASE_UI_CONTAMINATION_GATE.md'
      - 'tests/test_release_events.py'
      - 'docs/P23D2_NOVEMBER_DECEMBER_RELEASE_DATE_REPAIR.md'
      - 'agentfuse_crawlers/data/validation_access_reviews.json'
      - 'agentfuse_crawlers/data/bulk_run_authorizations.json'
      - 'scripts/audit_bulk_validation_policy.py'
      - 'docs/P21B_ENFORCED_BULK_ACCESS_RUNBOOK.md'
      - 'scripts/accession_cross_category_html.py'
      - 'tests/test_p22a1_cross_category_accession.py'
      - 'docs/P22A1_CROSS_CATEGORY_EVIDENCE_ACCESSION.md'
      - 'scripts/p22c2_pilot_readiness.py'
      - 'tests/test_p22c2_pilot_readiness.py'
      - 'docs/P22C2A_ORIGINAL_PUBLISHER_PILOT_EVIDENCE_GATE.md'
      - 'scripts/full_crawl_readiness.py'
      - 'tests/test_p23a_full_crawl_readiness.py'
      - 'docs/P23A_FULL_CRAWL_READINESS_AUDIT.md'
      - 'scripts/g0_priority_review_queue.py'
      - 'tests/test_g0_priority_review_queue.py'
      - 'docs/G0_PRIORITIZED_SOURCE_REVIEW_AND_CANARY_SHORTLIST.md'
      - 'scripts/p23c1_zyte_canary_archive_gate.py'
      - 'tests/test_p23c1_zyte_canary_archive_gate.py'
      - 'docs/P23C1_ZYTE_CANARY_ARCHIVE_EVIDENCE_GATE.md'
      - 'scripts/p23c2_zyte_requests_logs_html_gate.py'
      - 'tests/test_p23c2_zyte_requests_logs_html_gate.py'
      - 'docs/P23C2_ZYTE_REQUESTS_LOGS_ORIGINAL_HTML_AUDIT.md'
      - 'scripts/p23c3b_first_canary_operator_handoff.py'
      - 'tests/test_p23c3b_first_canary_operator_handoff.py'
      - 'docs/P23C3B_FIRST_LIVE_CANARY_OPERATOR_HANDOFF.md'

permissions:
  contents: read

jobs:
  no_network_preflight:
    name: Make downloadable 460-source review + Zyte UI args
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out exact GitHub repository revision
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository dependencies (no publisher/Zyte access)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install .
      - name: Produce offline 460-source review and two manual canary waves
        run: |
          python -m scripts.full_inventory_readiness \
            --out-dir output/private/p20b-preflight
      - name: Produce exact copy/paste UI arguments for three full spiders
        run: |
          python -m scripts.prepare_zyte_ui_args \
            --out-dir output/private/p20b-zyte-args
      - name: Freeze P22A1 18-source, 36-round original HTML study (BLANK only)
        run: |
          python -m scripts.accession_cross_category_html             --prepare             --out-dir output/private/p22a1-blank
      - name: Prepare P22C2A six pricing sources / 12 rounds (BLANK only)
        run: |
          python -m scripts.p22c2_pilot_readiness --prepare             --out-dir output/private/p22c2a-blank
      - name: Audit P21B source-specific bulk permission gate offline
        run: |
          python -m scripts.audit_bulk_validation_policy             --out-dir output/private/p21b-bulk-policy
      - name: Produce P23A unified exact-460 NO-GO audit (no network)
        run: |
          python -m scripts.full_crawl_readiness \
            --out-dir output/private/p23a-readiness
      - name: Rank G0 source review priorities and 12 supplemental canary candidates (NO APPROVAL)
        run: |
          python -m scripts.g0_priority_review_queue \
            --out-dir output/private/g0-priority
      - name: Prepare P23C1 original 18-source / 36-round job receipts (BLANK ONLY)
        run: |
          python -m scripts.p23c1_zyte_canary_archive_gate \
            --prepare --out-dir output/private/p23c1-blank
      - name: Prepare P23C2 raw Requests/Logs receipts (BLANK ONLY)
        run: |
          python -m scripts.p23c2_zyte_requests_logs_html_gate \
            --prepare --out-dir output/private/p23c2-blank
      - name: Generate P23C3B first real-canary operator packet (THREE sources, NO APPROVAL)
        run: |
          python -m scripts.p23c3b_first_canary_operator_handoff \
            --out-dir output/private/p23c3b-first-canary
      - name: Refuse unsafe scope or inferred permissions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          prefix = Path("output/private")
          census = json.loads((prefix / "p20b-preflight" / "full_inventory_readiness.json").read_text())
          guide = json.loads((prefix / "p20b-zyte-args" / "zyte_full_3_spiders_NOT_AUTHORIZED.json").read_text())
          bulk = json.loads((prefix / "p21b-bulk-policy" / "bulk_validation_readiness.json").read_text())
          p22a = json.loads((prefix / "p22a1-blank" / "frozen_p20a_18_source_plan.json").read_text())
          blank = json.loads((prefix / "p22a1-blank" / "source_policy_and_capture_ledger_BLANK.json").read_text())
          p22c2 = json.loads((prefix / "p22c2a-blank" / "p22c2a_six_pricing_sources_BLANK.json").read_text())
          p23a = json.loads((prefix / "p23a-readiness" / "full_crawl_readiness_NO_GO.json").read_text())
          g0 = json.loads((prefix / "g0-priority" / "g0_source_priority_summary_NO_GO.json").read_text())
          assert g0["status"] == "NO_GO_NOT_AUTHORIZED"
          assert g0["total_configured_sources"] == 460
          assert g0["top_300_provisional_source_count"] == 300
          assert g0["top_300_category_counts"] == {"documentation": 120, "pricing": 120, "changelog": 60}
          assert len(g0["supplemental_canary_source_ids"]) == 12
          assert g0["supplemental_canary_distinct_hostnames"] == 12
          assert g0["original_frozen_canary_round_denominator"] == 36
          assert g0["original_frozen_canary_source_ids"] == p23a["frozen_canary_source_ids"]
          assert g0["p23a_readiness_report_sha256"] == p23a["report_sha256"]
          assert g0["publisher_permissions_added"] == g0["publisher_gets_performed"] == g0["zyte_jobs_started"] == 0
          assert g0["ranking_is_authorization"] is False
          p23c1 = json.loads((prefix / "p23c1-blank" / "zyte_canary_job_receipts_BLANK.json").read_text())
          p23c2 = json.loads((prefix / "p23c2-blank" / "raw_requests_logs_receipt_index_BLANK.json").read_text())
          first_pilot = json.loads((prefix / "p23c3b-first-canary" / "first_3_source_canary_handoff_NO_GO.json").read_text())
          assert first_pilot["status"] == "NO_GO_PENDING_REAL_SOURCE_REVIEW_AND_OPERATOR"
          assert first_pilot["execution_permitted"] is False
          assert first_pilot["canary_jobs_started"] == 0
          assert first_pilot["publisher_network_requests_performed"] == 0
          assert first_pilot["publisher_permission_independently_authenticated"] is False
          assert first_pilot["remote_zyte_deployment_independently_verified"] is False
          assert first_pilot["initial_pilot_source_ids"] == ["kiro_docs", "gemini_api_pricing", "openai_api_changelog"]
          assert first_pilot["initial_pilot_sources"] == 3
          assert first_pilot["initial_pilot_manual_job_specs"] == 6
          assert first_pilot["original_plan_sha256"] == p23c1["frozen_plan_sha256"]
          assert len(first_pilot["jobs"]) == 6
          assert all(j["operator_canary_authorization"] == "NOT_AUTHORIZED_BY_PACKET"
                     and j["zyte_job_id"] is None and j["advisor_approved"] is False
                     for j in first_pilot["jobs"])
          assert p23c2["frozen_plan_sha256"] == p23c1["frozen_plan_sha256"]
          assert p23c2["approved_for_advisor"] is False
          assert len(p23c2["rows"]) == 18
          assert sum(len(row["rounds"]) for row in p23c2["rows"]) == 36
          assert [r["source_id"] for r in p23c2["rows"]] == [r["source_id"] for r in p23c1["rows"]]
          assert all(slot["zyte_job_id"] is None
                     and slot["requests"] is None and slot["logs"] is None
                     for row in p23c2["rows"] for slot in row["rounds"])
          assert p23c1["frozen_plan_sha256"] == p22a["plan_sha256"]
          assert p23c1["approved_for_advisor"] is False
          assert len(p23c1["rows"]) == 18
          assert sum(len(x["rounds"]) for x in p23c1["rows"]) == 36
          assert all(slot["zyte_job_id"] is None
                     for row in p23c1["rows"] for slot in row["rounds"])
          assert p23a["status"] == "NO_GO"
          assert p23a["counts"]["configured_source_ids"] == 460
          assert p23a["counts"]["technical_validation_eligible_NOT_permission"] == 457
          counts = p23a["counts"]
          eligible = counts["locally_valid_plan_eligible_source_ids_NOT_remote_verified"]
          assert 0 <= eligible <= counts["technical_validation_eligible_NOT_permission"]
          assert eligible <= counts["current_bulk_review_attestations_NOT_legal_grants"]
          assert counts["unreviewed_or_unplanned_source_ids"] == 460 - eligible
          assert counts["actual_publisher_requests_authorized_by_this_report"] == 0
          assert p23a["bulk_run_approved"] is False
          assert p23a["new_zyte_jobs"] == p23a["network_requests_performed"] == 0
          assert census["configured_sources"] == 460
          assert census["category_counts"] == {"documentation": 194, "pricing": 177, "changelog": 89}
          assert census["full_inventory_one_time_diagnostic_crawl"] == "NO_GO_PENDING_EVIDENCE"
          assert census["full_inventory_automatic_monitoring"] == "NO_GO_PENDING_PER_SOURCE_APPROVAL"
          assert census["network_requests_performed"] == census["new_zyte_jobs"] == 0
          assert guide["full_diagnostic_approved_to_run"] is False
          assert bulk["counts"]["configured_source_ids"] == 460
          assert bulk["bulk_run_authorized_by_this_audit"] is False
          assert bulk["new_zyte_jobs"] == bulk["network_requests_performed"] == 0
          assert p22a["selected_source_count"] == 18
          assert p22a["source_round_denominator"] == 36
          assert p22a["publisher_permissions_granted"] == 0
          assert blank["human_gold_supplied"] is False
          assert len(blank["rows"]) == 18
          assert p22c2["frozen_p20a_plan_sha256"] == p22a["plan_sha256"]
          assert p22c2["pricing_source_denominator"] == 6
          assert p22c2["pricing_round_denominator"] == 12
          assert len(p22c2["sources"]) == 6
          assert sum(len(s["rounds"]) for s in p22c2["sources"]) == 12
          assert all(x["publisher_policy_status"] == "not_reviewed"
                     and x["original_html_status"] == "not_supplied"
                     and x["approved_for_advisor"] is False
                     for s in p22c2["sources"] for x in s["rounds"])
          assert p22c2["publisher_permissions_granted"] == 0
          assert p22c2["actual_publisher_html_captured"] == 0
          assert p22c2["real_independent_human_labels"] == 0
          assert p22c2["bulk_crawl_authorized"] is False
          assert all(len(row["rounds"]) == 2 for row in blank["rows"])
          assert all(round_["state"] == "not_attempted"
                     for row in blank["rows"] for round_ in row["rounds"])
          assert guide["network_requests_performed"] == guide["zyte_jobs_created"] == 0
          assert len(guide["jobs"]) == 3
          assert sum(j["configured_source_count"] for j in guide["jobs"]) == 460
          for job in guide["jobs"]:
              args = job["arguments"]
              assert args["cohort"] == "all"
              assert args["collection_mode"] == "validation"
              assert args["confirm_full_inventory"] == "yes"
              assert "source_ids" not in args and "limit" not in args
              assert job["operator_review_status"].startswith("NOT_AUTHORIZED")
          for wid in ("wave_01", "wave_02"):
              w = json.loads((prefix / "p20b-preflight" / wid / "manual_canary_plan.json").read_text())
              assert w["total_expected_jobs"] == 18 and w["execution_permitted"] is False
              assert all(x["spider_args"]["source_ids"] == x["source_id"] for x in w["jobs"])
          print("Offline ready. Exactly 460 accounted, 36 manual canary job specifications, ZERO Zyte jobs.")
          print("Publisher policy and real-world accuracy NOT VERIFIED. Full run is not approved by this file.")
          PY
      - name: Upload downloadable operator materials (not approvals)
        uses: actions/upload-artifact@v4
        with:
          name: p20b-zyte-no-local-preflight-${{ github.run_id }}
          path: |
            output/private/p20b-preflight/
            output/private/p20b-zyte-args/
            output/private/p21b-bulk-policy/
            output/private/p22a1-blank/
            output/private/p22c2a-blank/
            output/private/p23a-readiness/
            output/private/g0-priority/
            output/private/p23c1-blank/
            output/private/p23c2-blank/
            output/private/p23c3b-first-canary/
          retention-days: 14
          if-no-files-found: error
      - name: Explain what the artifact means
        run: |
          {
            echo "### P20B preflight complete — NO Zyte crawl triggered"
            echo ""
            echo "Download the Actions artifact to obtain:"
            echo "- full_inventory_readiness.json and all_460_source_review_queue.csv"
            echo "- Wave 1 and Wave 2 exact two-round one-source Zyte manual canary plans"
            echo "- READ_ME_ZYTE_UI_SETTINGS_NOT_AUTHORIZED.txt and CSV/JSON exact full-spider arguments"
            echo "- P21B bulk_validation_readiness.json and all_460_source_bulk_review_queue.csv"
            echo "- P22A1 BLANK frozen 18-source original HTML/policy study templates (NO HTML)"
            echo "- P22C2A BLANK six-pricing-source, 12-round private pilot checklist (NO publisher access)"
            echo "- P23A unified full_crawl_readiness_NO_GO.json and 460-ID source_dispositions_460.csv"
            echo "- G0 ranked 460 queue, provisional top-300 and 12 supplementary canary source reviews (NO APPROVAL)"
            echo "- P23C1 BLANK 18-source/36-round immutable Zyte archive receipt ledger (no jobs)"
            echo "- P23C2 BLANK 18-source/36-round raw Zyte Requests/Logs receipt ledger (no network)"
            echo "- P23C3B first three-source manual canary review queue and six NOT_AUTHORIZED Zyte UI job specs"
            echo ""
            echo "**These arguments are NOT approval to run full source collection.**"
            echo "**P21B:** cohort=all plus confirm_full_inventory=yes now produces held Items without an exact Git-reviewed URL+run plan."
            echo "Review publisher policies, complete real canaries, verify Zyte deployment, then authorize one supervised diagnostic."
            echo "No source IDs, deployed spiders, schedules, permissions or production data were changed."
          } >> "$GITHUB_STEP_SUMMARY"
